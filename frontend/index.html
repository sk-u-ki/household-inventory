<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f6b4a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Домашний склад</title>
    <link rel="manifest" href="/app/manifest.json" />
    <link rel="icon" href="/app/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/app/icon-192.png" />
    <link rel="stylesheet" href="/app/styles.css" />
  </head>
  <body>
    <header>
      <div class="header-row">
        <div>
          <h1 id="title">Склад</h1>
          <p id="subtitle">Остатки считаются из покупок</p>
        </div>
        <button id="sync" class="secondary header-action" type="button">Обновить чеки</button>
      </div>
      <p id="sync-status" class="hidden"></p>
    </header>
    <main id="view"></main>
    <nav class="tabs">
      <button data-tab="inventory" class="active">Склад</button>
      <button data-tab="review">Проверка</button>
      <button data-tab="catalog">Продукты</button>
      <button data-tab="in">Приход</button>
    </nav>
    <script src="/app/app.js"></script>
  </body>
</html>
